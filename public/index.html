<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yard Map</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/yard.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>

  <header>
    <h1>
      <span>
        Yard Map
        <small><span id="live" class="live off">Connecting…</span> · <span id="count"></span></small>
      </span>
      <small class="user">
        <span id="me"></span> ·
        <a href="/login.html#change">Password</a> ·
        <span id="manage-link" hidden><a href="/manage.html">Manage</a> ·</span>
        <button class="link" id="b-logout">Log out</button>
      </small>
    </h1>
    <input id="q" type="search" placeholder="Find reg. number, trailer ID or note…" autocomplete="off">
    <div id="msg"></div>
    <div class="legend">
      <span class="items" id="legend-items"></span>
      <span class="zoom">
        <button id="b-histall">History</button>
        <button id="zoom-out">−</button>
        <button id="zoom-fit">Fit</button>
        <button id="zoom-in">+</button>
      </span>
    </div>
  </header>

  <main id="main">
    <!-- Unassigned trailers (filled in by map.js) -->
    <aside class="side lot" id="side"></aside>

    <!-- The yard map -->
    <div class="lot">
      <div class="pan" id="pan">
        <div class="scene" id="scene">
          <div class="bld hall" style="left:460px; top:130px; width:960px; height:430px">WAREHOUSE</div>
          <div class="bld" style="left:190px; top:560px; width:1230px; height:150px"></div>
          <div class="bld" style="left:190px; top:560px; width:700px; height:300px"></div>
          <div id="map"></div>
        </div>
      </div>
      <div class="gate">
        <div class="booth">GATE</div>
        <div class="arm"></div>
        <div class="lanes"><span>⇠ OUT</span><span>IN ⇢</span></div>
      </div>
    </div>
  </main>

  <!-- Edit sheet: opens when a spot is tapped (sheet.js) -->
  <div id="sheet">
    <h3 id="sh-title"></h3>
    <input id="f-tr" placeholder="Reg. number (licence plate)" autocapitalize="characters" autocomplete="off">
    <input id="f-tid" placeholder="Trailer ID" autocomplete="off">
    <p class="hint" id="tid-hint"></p>
    <div class="chips" id="chips"></div>
    <input id="f-note" placeholder="Note (optional)" autocomplete="off">
    <div class="row sheet-row">
      <button class="chip tog" id="f-dmg" type="button">⚠ Damaged</button>
      <label class="arr" id="f-arr-wrap">Arrived <input type="datetime-local" id="f-arr"></label>
    </div>
    <div class="row sheet-row" id="occ-row">
      <button class="btn" id="b-move">Move</button>
      <button class="btn" id="b-depart">Departed</button>
      <button class="btn warn" id="b-remove">Remove</button>
    </div>
    <div class="row">
      <button class="btn" id="b-cancel">Cancel</button>
      <button class="btn" id="b-hist">History</button>
      <button class="btn pri" id="b-save">Save</button>
    </div>
  </div>

  <!-- History panel (history.js) -->
  <div id="hist">
    <div class="panel">
      <div class="hbar">
        <h3 id="h-title">History</h3>
        <button class="btn" id="h-close">Close</button>
      </div>
      <div id="h-body"></div>
    </div>
  </div>

</body>
</html>
