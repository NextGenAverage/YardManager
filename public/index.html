<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yard Map</title>
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#1b2130;--mute:#6a7286;--line:#cfd4de;--accent:#2f6fdb;
--paint:#eceff3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--ink:#eef0f5;--mute:#98a0b3;--line:#333b4c;--accent:#6aa0ff}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--ink:#eef0f5;--mute:#98a0b3;--line:#333b4c;--accent:#6aa0ff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font-weight:400;color:var(--mute);font-size:13px}
.live:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fa862;margin-right:5px}
.live.off{color:#d64545}.live.off:before{background:#d64545}
#q{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#msg{font-size:13px;color:var(--mute);min-height:18px;margin-top:4px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:2px}
.legend .items{display:contents}
.legend .items span{white-space:nowrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
main{padding:10px;max-width:2200px;margin:0 auto;display:flex;gap:10px;align-items:flex-start}
main>.lot:last-child{flex:1;min-width:0}
/* Side panel (Unassigned trailers): beside the map, not affected by map zoom */
.side{flex:0 0 auto;position:sticky;top:calc(var(--hh,120px) + 10px);max-height:calc(100vh - var(--hh,120px) - 20px);overflow-y:auto;padding:10px}
.side .sec{position:static}
.side .grid{grid-template-columns:repeat(4,var(--cw))}
@media (max-width:699px){
  main{flex-direction:column;align-items:stretch}
  .side{position:static;max-height:none;overflow-x:auto}
  .side .grid{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:var(--cw);width:max-content}
}
.lot{background:#3a3e45 radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px) 0 0/6px 6px;border:4px solid #5b606a;border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.pan{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scene{position:relative;width:1560px;height:1240px}
.zoom{margin-left:auto;display:flex;gap:4px}
.zoom button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:2px 10px;font:inherit;font-size:13px;cursor:pointer}
.bld{position:absolute;background:repeating-linear-gradient(90deg,#aab0b9 0 38px,#9aa0a8 38px 40px);color:#3c424c}
.bld.hall{display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.35em;border-bottom:4px solid #7b818b}
.on .bay{display:flex;flex-direction:column-reverse}
.ow .bay,.oe .bay{display:flex;height:var(--th)}
.ow .bay{flex-direction:row-reverse}.oe .bay{flex-direction:row}
.ow .grid,.oe .grid{border-left:0;border-top:3px solid var(--paint)}
.ow .door,.oe .door{display:flex;width:24px;padding:4px 0}
.ow .dr,.oe .dr{flex:1;height:auto;line-height:1;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:11px;border-radius:3px}
.ow .stall,.oe .stall{width:var(--sh);height:var(--th);border-right:0;border-bottom:3px solid var(--paint)}
.ow .trl,.oe .trl{justify-content:center;padding:0 5px}
.ow .trl .tr,.oe .trl .tr{writing-mode:horizontal-tb;transform:none;flex:none;align-self:stretch;justify-content:center}
.sec{position:absolute}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#f4d34a;margin:0 0 4px 2px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(var(--cols),var(--cw));border-left:3px solid var(--paint)}
.pkg{border-bottom:3px solid #f4d34a;border-left-color:#f4d34a}
.bay{display:block;width:var(--cw);background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.door{display:block;background:#9aa0a8;padding:4px 4px 0}
.dr{display:block;height:24px;border-radius:3px 3px 0 0;background:repeating-linear-gradient(180deg,#d3d8df 0 3px,#aab0ba 3px 4px);font:700 12px/24px system-ui,sans-serif;color:#2a2f38}
.bay.on .dr{background:linear-gradient(#1d2026,#454c58);color:#ffd54a}
.stall{display:block;position:relative;height:var(--sh);border-right:3px solid var(--paint)}
.pkg .stall{border-right-color:#f4d34a;border-top:3px solid #f4d34a}
.bay:not(.on) .stall:after{content:"open";position:absolute;left:0;right:0;bottom:5px;font-size:10px;color:rgba(255,255,255,.28)}
.lbl{position:absolute;left:0;right:0;top:4px;font-size:10px;color:rgba(255,255,255,.45)}
.trl{position:absolute;inset:2px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 2px;color:var(--fg,#fff);overflow:hidden;
background:repeating-linear-gradient(180deg,rgba(0,0,0,.1) 0 2px,transparent 2px 9px),linear-gradient(90deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c) 45%,color-mix(in srgb,var(--c) 80%,#000));
box-shadow:0 4px 8px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.35);transition:transform .12s}
.trl .tr{writing-mode:vertical-rl;transform:rotate(180deg);font-size:15px;line-height:1;font-weight:800;letter-spacing:.02em;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5);flex:1;min-height:0;min-width:0;overflow:hidden;display:flex;align-items:center}
.trl.dmg{outline:3px solid #e5392f;outline-offset:1px}
.trl .dw{font-size:10px;font-weight:600;opacity:.9;font-style:normal;white-space:nowrap}
.bay.lift .trl{transform:translateY(-6px) scale(1.1);z-index:3;overflow:visible;box-shadow:0 12px 16px rgba(0,0,0,.6),0 0 0 3px #fff}
.bay.hit .trl{box-shadow:0 0 0 4px #ffd54a,0 0 16px 6px rgba(255,213,74,.6)}
.gate{position:relative;margin-top:6px;padding:26px 10px 12px;border-top:5px solid #555b66;background:linear-gradient(#2d3036,#3a3e45)}
.gate:before{content:"";position:absolute;top:-14px;left:0;right:0;height:9px;background:repeating-linear-gradient(90deg,#8d939d 0 3px,transparent 3px 14px)}
.arm{position:absolute;top:4px;left:50%;right:10px;height:10px;border-radius:5px;background:repeating-linear-gradient(135deg,#e5392f 0 10px,#fff 10px 20px);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.booth{position:absolute;top:-2px;left:10px;width:46px;height:22px;border-radius:4px;background:#d8dde5;font-size:10px;font-weight:700;color:#3c424c;text-align:center;line-height:22px}
.lanes{display:flex;justify-content:space-around;color:#f5e6b8;font-weight:700;letter-spacing:.12em;font-size:13px;border-top:3px dashed rgba(245,230,184,.5);padding-top:8px}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25);transform:translateY(110%);transition:transform .2s;z-index:10;max-width:640px;margin:0 auto}
#sheet.open{transform:none}
#sheet h3{margin:0 0 8px;font-size:16px}
#sheet input{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:8px}
.chips{display:flex;gap:6px;margin-bottom:10px}
.chip{flex:1;padding:9px 2px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip.sel{background:var(--c);border-color:var(--c);color:var(--fg,#fff);font-weight:600}
.row{display:flex;gap:8px}
.btn{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.warn{color:#d64545}
.sheet-row{margin-bottom:8px}
.chip.tog.sel{--c:#e5392f}
.arr{flex:1;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
#sheet .arr input{margin:0;padding:8px;font-size:14px;flex:1;min-width:0}
.link{border:0;background:none;color:var(--accent);font:inherit;padding:0;cursor:pointer;text-decoration:underline}
#hist{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:none}
#hist.open{display:block}
#hist .panel{position:absolute;top:0;bottom:0;right:0;width:100%;max-width:560px;background:var(--card);overflow:auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:-8px 0 30px rgba(0,0,0,.25)}
.hbar{display:flex;align-items:center;gap:8px;position:sticky;top:-12px;background:var(--card);padding:12px 0 8px;margin-top:-12px;border-bottom:1px solid var(--line)}
.hbar h3{flex:1;margin:0;font-size:16px}
.hbar .btn{flex:0 0 auto;padding:7px 14px}
#hist h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 0 6px}
#hist ul{list-style:none;margin:0;padding:0}
#hist li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
#hist li time,#hist li small{display:block;font-size:12px;color:var(--mute)}
.visit{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.visit form{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.visit form input{flex:1;min-width:170px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
</style>
</head>
<body>
<header>
<h1>Yard Map <small><span id="live" class="live off">Connecting…</span> · <span id="count"></span></small></h1>
<input id="q" type="search" placeholder="Find trailer number or note…" autocomplete="off">
<div id="msg"></div>
<div class="legend">
<span class="items" id="legend-items"></span>
<span class="zoom"><button id="b-histall">History</button><button id="zo">−</button><button id="zf">Fit</button><button id="zi">+</button></span>
</div>
</header>
<main>
<aside class="side lot" id="side"></aside>
<div class="lot">
<div class="pan" id="pan"><div class="scene" id="scene">
<div class="bld hall" style="left:460px;top:130px;width:960px;height:430px">WAREHOUSE</div><div class="bld" style="left:190px;top:560px;width:1230px;height:150px"></div><div class="bld" style="left:190px;top:560px;width:700px;height:300px"></div>
<div id="map"></div>
</div></div>
<div class="gate"><div class="booth">GATE</div><div class="arm"></div><div class="lanes"><span>⇠ OUT</span><span>IN ⇢</span></div></div>
</div>
</main>
<div id="sheet">
<h3 id="sh-title"></h3>
<input id="f-tr" placeholder="Trailer number" autocapitalize="characters" autocomplete="off">
<div class="chips" id="chips"></div>
<input id="f-note" placeholder="Note (optional)" autocomplete="off">
<div class="row sheet-row">
<button class="chip tog" id="f-dmg" type="button">⚠ Damaged</button>
<label class="arr" id="f-arr-wrap">Arrived <input type="datetime-local" id="f-arr"></label>
</div>
<div class="row sheet-row" id="occ-row">
<button class="btn" id="b-move">Move</button>
<button class="btn" id="b-depart">Departed</button>
<button class="btn warn" id="b-remove">Remove</button>
</div>
<div class="row">
<button class="btn" id="b-cancel">Cancel</button>
<button class="btn" id="b-hist">History</button>
<button class="btn pri" id="b-save">Save</button>
</div>
</div>
<div id="hist"><div class="panel">
<div class="hbar"><h3 id="h-title">History</h3><button class="btn" id="h-close">Close</button></div>
<div id="h-body"></div>
</div></div>
<script>
// Layout, statuses and trailers come from the server (/api/yard).
var SECTIONS=[],STATUS={},data={},cur=null,curStatus="",def="",sel=null,busy=false;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return"&#"+c.charCodeAt(0)+";"})}
// Dark text on light status colors (e.g. Undefined), white text otherwise.
function fg(hex){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return .299*r+.587*g+.114*b>170?"#1b2130":"#fff"}
function colors(name){var c=STATUS[name]||"#8b93a5";return"--c:"+c+";--fg:"+fg(c)}
function dwell(ts){var m=Math.floor((Date.now()-ts)/60000);if(m<60)return m+"m";var h=Math.floor(m/60);return h<48?h+"h":Math.floor(h/24)+"d"}
function apply(st){
  SECTIONS=st.sections;data=st.placements;STATUS={};
  st.statuses.forEach(function(s){STATUS[s.name]=s.color});
  if(sel&&!data[sel])sel=null;
  legend();render();
}
// Talk to the server. On success the reply is the new yard state.
function api(path,body){
  busy=true;
  return fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{})
    .then(function(r){return r.json().then(function(j){
      if(j.sections)apply(j);
      if(!r.ok)throw new Error(j.error||"Request failed");
      return j;
    })})
    .catch(function(e){$("msg").textContent=e.message==="Failed to fetch"?"Can't reach the server. Check the connection and try again.":e.message;throw e})
    .finally(function(){busy=false});
}
function legend(){
  var h="";Object.keys(STATUS).forEach(function(k){h+='<span><i style="background:'+STATUS[k]+'"></i>'+esc(k)+'</span>'});
  $("legend-items").innerHTML=h;
}
function render(){
  // Unassigned ("pool") sections go in the side panel, everything else on the map.
  var html="",side="",total=0,used=0;
  SECTIONS.forEach(function(s,si){
    var h='<div class="sec o'+s.o+'" style="--th:'+(s.th||40)+'px;left:'+s.x+'px;top:'+s.y+'px;--cols:'+s.cols+';--cw:'+s.cw+'px;--sh:'+s.sh+'px">'+(s.title?'<h2>'+esc(s.title)+'</h2>':'')+'<div class="grid'+(s.kind!=="door"?" pkg":"")+'">';
    s.spots.forEach(function(id){
      total++;var d=data[id];if(d)used++;
      h+='<button class="bay'+(d?" on":"")+'" data-id="'+esc(id)+'" data-s="'+si+'">';
      if(s.kind==="door")h+='<span class="door"><span class="dr">'+esc(id)+'</span></span>';
      h+='<span class="stall">';
      if(s.kind!=="door"&&!d)h+='<span class="lbl">'+esc(id)+'</span>';
      if(d)h+='<span class="trl'+(d.damaged?" dmg":"")+'" style="'+colors(d.status)+'"><b class="tr"></b><i class="dw">'+(d.damaged?"⚠ ":"")+dwell(d.since)+'</i></span>';
      h+='</span></button>';
    });
    h+='</div></div>';
    if(s.kind==="pool")side+=h;else html+=h;
  });
  $("map").innerHTML=html;
  $("side").innerHTML=side;$("side").hidden=!side;
  if(auto)fit(); // the side panel's width changes the room left for the map
  sizeScene();
  var btns=document.querySelectorAll(".bay");
  for(var i=0;i<btns.length;i++){
    var b=btns[i],d=data[b.dataset.id];
    if(d)b.querySelector(".tr").textContent=d.trailer;
    if(b.dataset.id===sel)b.classList.add("lift");
    b.onclick=function(){tap(this.dataset.id,+this.dataset.s)};
  }
  fitNumbers();
  $("count").textContent=used+" of "+total+" spots in use";
  find(false);
  if(sel&&data[sel]&&!$("q").value)$("msg").textContent="Moving "+data[sel].trailer+": tap an open spot to place it, or tap it again to cancel";
}
// The map is as tall as its lowest section (title + rows of spots + door strip).
var sceneH=1240;
function sizeScene(){
  var h=0;
  SECTIONS.forEach(function(s){
    if(s.kind==="pool")return;
    var rows=Math.ceil(s.spots.length/s.cols),side=s.o==="e"||s.o==="w";
    h=Math.max(h,s.y+(s.title?18:0)+rows*(side?(s.th||40):s.sh+(s.kind==="door"?28:0))+6);
  });
  var nh=Math.max(600,h+20);
  if(nh!==sceneH){sceneH=nh;$("scene").style.height=sceneH+"px";if(auto)fit()}
}
// Trailer numbers start large and shrink only as much as needed to fit their spot.
function fitNumbers(){
  var trs=document.querySelectorAll(".trl .tr");
  for(var i=0;i<trs.length;i++){
    var el=trs[i],f=18;el.style.fontSize=f+"px";
    while(f>9&&(el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1))el.style.fontSize=--f+"px";
  }
}
// Tapping a spot opens its edit sheet. After "Move" in the sheet the trailer is
// lifted (sel) and the next tap on an open spot moves it there.
function tap(id,si){
  if(busy)return;
  var d=data[id];
  if(sel){
    if(id===sel){sel=null;render();return}
    if(!d){var from=sel;sel=null;api("/api/move",{from:from,to:id}).catch(function(){});return}
    $("msg").textContent="That spot is taken. Tap an open spot, or tap "+data[sel].trailer+" again to cancel.";return;
  }
  openSheet(id,si);
}
function chips(){
  var h="";Object.keys(STATUS).forEach(function(k){h+='<button class="chip'+(k===curStatus?" sel":"")+'" style="'+colors(k)+'" data-k="'+esc(k)+'">'+esc(k)+'</button>'});
  $("chips").innerHTML=h;
  var c=document.querySelectorAll("#chips .chip");
  for(var i=0;i<c.length;i++)c[i].onclick=function(){curStatus=this.dataset.k;chips()};
}
function sectionOf(id){for(var i=0;i<SECTIONS.length;i++)if(SECTIONS[i].spots.indexOf(id)>-1)return SECTIONS[i]}
function spotName(id){var s=sectionOf(id);return s?s.noun+(/^[PU]\d+$/.test(id)?id.slice(1):id):"spot "+id}
// <input type="datetime-local"> works in local time without seconds.
function toLocal(ms){var d=new Date(ms-new Date(ms).getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}
function fromLocal(v){return v?new Date(v).getTime():undefined}
var curDmg=false,arrOrig="";
function dmgBtn(){$("f-dmg").classList.toggle("sel",curDmg)}
$("f-dmg").onclick=function(){curDmg=!curDmg;dmgBtn()};
function openSheet(id,si){
  cur=id;def=SECTIONS[si].defaultStatus;var d=data[id];
  $("sh-title").textContent=spotName(id);
  $("f-tr").value=d?d.trailer:"";$("f-note").value=d&&d.note?d.note:"";
  curStatus=d?d.status:def;chips();
  curDmg=!!(d&&d.damaged);dmgBtn();
  arrOrig=d?toLocal(d.since):"";$("f-arr").value=arrOrig;
  $("f-arr-wrap").style.display=d?"":"none";$("occ-row").style.display=d?"":"none";
  $("sheet").classList.add("open");
  if(!d)setTimeout(function(){$("f-tr").focus()},220);
}
function closeSheet(){$("sheet").classList.remove("open");cur=null;document.activeElement&&document.activeElement.blur()}
$("b-cancel").onclick=closeSheet;
$("b-move").onclick=function(){sel=cur;closeSheet();render()};
// Esc closes the sheet or cancels a move (keyboard users on PCs).
document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;if(histQ)$("h-close").onclick();else if(cur)closeSheet();else if(sel){sel=null;render()}});
$("b-depart").onclick=function(){
  if(!confirm(data[cur].trailer+" has left the yard?"))return;
  api("/api/depart",{spot:cur}).then(closeSheet,function(){});
};
$("b-remove").onclick=function(){
  if(!confirm("Remove "+data[cur].trailer+"?\n\nOnly use this if it was entered by mistake. If the trailer has left, use Departed instead."))return;
  api("/api/remove",{spot:cur}).then(closeSheet,function(){});
};
$("b-save").onclick=function(){
  var t=$("f-tr").value.trim().toUpperCase();
  if(!t){$("f-tr").focus();return}
  var arr=$("f-arr").value;
  api("/api/place",{spot:cur,trailer:t,status:curStatus,note:$("f-note").value.trim(),damaged:curDmg,
    arrivedAt:arr!==arrOrig?fromLocal(arr):undefined}).then(closeSheet,function(){});
};
$("b-hist").onclick=function(){var d=data[cur];openHist(d?{trailer:d.trailer,spot:cur}:{spot:cur})};

// ---- History panel ----
function fmt(ms){return new Date(ms).toLocaleString([],{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function dur(ms){var m=Math.round(ms/60000);if(m<60)return m+"m";var h=Math.floor(m/60);return h<48?h+"h "+m%60+"m":Math.floor(h/24)+"d "+h%24+"h"}
function trLink(t){return'<button class="link" data-tr="'+esc(t)+'">'+esc(t)+'</button>'}
var FIELDS={trailer:"trailer number",status:"status",note:"note",arrived_at:"arrival",departed_at:"departure"};
function describe(e){
  var t=trLink(e.trailer),d=e.details||{};
  if(e.action==="arrive")return t+" arrived at "+esc(spotName(e.to_spot))+(d.status?" ("+esc(d.status)+")":"");
  if(e.action==="move")return t+" moved "+esc(spotName(e.from_spot))+" → "+esc(spotName(e.to_spot));
  if(e.action==="depart")return t+" departed from "+esc(spotName(e.from_spot));
  if(e.action==="remove")return t+" removed from "+esc(spotName(e.from_spot))+" (entered by mistake)";
  var parts=Object.keys(d).map(function(k){
    var a=d[k][0],b=d[k][1];
    if(k==="damaged")return b?"marked damaged":"damage cleared";
    if(k==="arrived_at"||k==="departed_at"){a=a?fmt(a):"–";b=b?fmt(b):"–"}
    return(FIELDS[k]||k)+" “"+esc(a===""?"–":a)+"” → “"+esc(b===""?"–":b)+"”";
  });
  return t+" at "+esc(spotName(e.to_spot||e.from_spot))+": "+parts.join(", ");
}
function eventList(events){
  if(!events.length)return'<p>No changes recorded yet.</p>';
  return"<ul>"+events.map(function(e){
    return"<li><time>"+fmt(e.at)+"</time>"+describe(e)+(e.user_name?"<small>by "+esc(e.user_name)+"</small>":"")+"</li>";
  }).join("")+"</ul>";
}
function visitList(visits){
  return"<ul>"+visits.map(function(v){
    var end=v.departed_at,h='<li class="visit"><span>Arrived</span><span>'+fmt(v.arrived_at)+'</span>';
    h+=end?'<span>Departed</span><span>'+fmt(end)+' from '+esc(spotName(v.spot_id))+' · stayed '+dur(end-v.arrived_at)+' <button class="link" data-fix="'+v.id+'">Fix times</button></span>'
      :'<span>Now</span><span>In the yard at '+esc(spotName(v.spot_id))+' · '+dur(Date.now()-v.arrived_at)+'</span>';
    if(end)h+='<form data-visit="'+v.id+'" hidden><input type="datetime-local" name="a" value="'+toLocal(v.arrived_at)+'" aria-label="Arrived"><input type="datetime-local" name="d" value="'+toLocal(end)+'" aria-label="Departed"><button class="btn pri">Save times</button></form>';
    return h+"</li>";
  }).join("")+"</ul>";
}
var histQ=null;
function openHist(q){
  histQ=q;
  $("h-title").textContent=q.trailer?"Trailer "+q.trailer:q.spot?spotName(q.spot):"Recent changes";
  $("h-body").innerHTML="<p>Loading…</p>";$("hist").classList.add("open");
  var qs=q.trailer?"?trailer="+encodeURIComponent(q.trailer):q.spot?"?spot="+encodeURIComponent(q.spot):"";
  fetch("/api/history"+qs).then(function(r){return r.json()}).then(function(h){
    if(histQ!==q)return;
    var html="";
    if(q.trailer){
      html+="<h4>Visits</h4>"+(h.visits.length?visitList(h.visits):"<p>No visits found for this trailer number.</p>");
      if(q.spot)html+='<p><button class="link" data-spot="'+esc(q.spot)+'">Show history for '+esc(spotName(q.spot))+'</button></p>';
    }
    $("h-body").innerHTML=html+"<h4>Changes</h4>"+eventList(h.events);
  },function(){$("h-body").innerHTML="<p>Can't reach the server.</p>"});
}
$("b-histall").onclick=function(){openHist({})};
$("h-close").onclick=function(){$("hist").classList.remove("open");histQ=null};
$("hist").onclick=function(e){if(e.target===this)$("h-close").onclick()};
$("h-body").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.tr)openHist({trailer:b.dataset.tr});
  else if(b.dataset.spot)openHist({spot:b.dataset.spot});
  else if(b.dataset.fix){var f=$("h-body").querySelector('form[data-visit="'+b.dataset.fix+'"]');f.hidden=!f.hidden}
};
$("h-body").onsubmit=function(e){
  e.preventDefault();var f=e.target;
  api("/api/visit-times",{id:+f.dataset.visit,arrivedAt:fromLocal(f.a.value),departedAt:fromLocal(f.d.value)})
    .then(function(){openHist(histQ)},function(){});
};
// Search found nothing on the map: offer that trailer's past visits.
$("msg").onclick=function(e){var b=e.target.closest("button");if(b&&b.dataset.tr)openHist({trailer:b.dataset.tr})};
function find(scroll){
  var q=$("q").value.trim().toUpperCase(),msg=$("msg");
  var btns=document.querySelectorAll(".bay"),first=null,n=0;
  for(var i=0;i<btns.length;i++){
    var d=data[btns[i].dataset.id],hit=!!(q&&d&&(d.trailer.indexOf(q)>-1||(d.note||"").toUpperCase().indexOf(q)>-1));
    btns[i].classList.toggle("hit",hit);
    if(hit){n++;if(!first)first=btns[i]}
  }
  if(!q)msg.textContent="";
  else if(!n)msg.innerHTML="No match for “"+esc(q)+"” on the map. "+'<button class="link" data-tr="'+esc(q)+'">Past visits</button>';
  else{msg.textContent=n+" found";if(scroll)first.scrollIntoView({block:"center",inline:"center",behavior:"smooth"})}
}
// Zoom. Automatic ("Fit"): PCs and tablets fill the screen width (scroll down for
// the rest); phones show the map at full size and pan. A zoom picked with +/−
// is remembered on this device.
var z=1,ZKEY="yard-zoom";
function setZ(v){z=Math.max(.4,Math.min(2.2,v));$("scene").style.zoom=z}
function saveZ(v){try{v?localStorage.setItem(ZKEY,v):localStorage.removeItem(ZKEY)}catch(e){}}
var auto=true;
function fit(f){var w=$("pan").clientWidth;if(w>=700)setZ(w/1560);else setZ(f?w/1560:1)}
$("zi").onclick=function(){auto=false;setZ(z+.15);saveZ(z)};$("zo").onclick=function(){auto=false;setZ(z-.15);saveZ(z)};
$("zf").onclick=function(){auto=true;saveZ(null);fit(true)};
function headerH(){document.documentElement.style.setProperty("--hh",document.querySelector("header").offsetHeight+"px")}
window.addEventListener("resize",function(){headerH();if(auto)fit()});
headerH();
try{var zs=+localStorage.getItem(ZKEY);if(zs){auto=false;setZ(zs)}}catch(e){}
if(auto)fit();
$("q").oninput=function(){find(true)};
$("msg").textContent="Loading…";
// Live updates: the server sends the whole yard every time anything changes.
// EventSource reconnects by itself if the connection drops.
var live=new EventSource("/api/events");
live.onmessage=function(e){apply(JSON.parse(e.data))};
live.onopen=function(){$("live").className="live";$("live").textContent="Live"};
live.onerror=function(){$("live").className="live off";$("live").textContent="Offline, reconnecting…"};
// Redraw once a minute so dwell times count up.
setInterval(function(){if(!sel)render()},60000);
</script>
