<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yard Map</title>
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#1b2130;--mute:#6a7286;--line:#cfd4de;--accent:#2f6fdb;
--paint:#eceff3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--ink:#eef0f5;--mute:#98a0b3;--line:#333b4c;--accent:#6aa0ff}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--ink:#eef0f5;--mute:#98a0b3;--line:#333b4c;--accent:#6aa0ff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font-weight:400;color:var(--mute);font-size:13px}
.live:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fa862;margin-right:5px}
.live.off{color:#d64545}.live.off:before{background:#d64545}
#q{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#msg{font-size:13px;color:var(--mute);min-height:18px;margin-top:4px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:2px}
.legend .items{display:contents}
.legend .items span{white-space:nowrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
main{padding:10px;max-width:2200px;margin:0 auto}
.lot{background:#3a3e45 radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px) 0 0/6px 6px;border:4px solid #5b606a;border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.pan{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scene{position:relative;width:1560px;height:1240px}
.zoom{margin-left:auto;display:flex;gap:4px}
.zoom button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:2px 10px;font:inherit;font-size:13px;cursor:pointer}
.bld{position:absolute;background:repeating-linear-gradient(90deg,#aab0b9 0 38px,#9aa0a8 38px 40px);color:#3c424c}
.bld.hall{display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.35em;border-bottom:4px solid #7b818b}
.on .bay{display:flex;flex-direction:column-reverse}
.ow .bay,.oe .bay{display:flex;height:var(--th)}
.ow .bay{flex-direction:row-reverse}.oe .bay{flex-direction:row}
.ow .grid,.oe .grid{border-left:0;border-top:3px solid var(--paint)}
.ow .door,.oe .door{display:flex;width:24px;padding:4px 0}
.ow .dr,.oe .dr{flex:1;height:auto;line-height:1;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:11px;border-radius:3px}
.ow .stall,.oe .stall{width:var(--sh);height:var(--th);border-right:0;border-bottom:3px solid var(--paint)}
.ow .trl,.oe .trl{flex-direction:row;padding:0 5px}
.ow .trl .tr,.oe .trl .tr{writing-mode:horizontal-tb;transform:none}
.sec{position:absolute}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#f4d34a;margin:0 0 4px 2px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(var(--cols),var(--cw));border-left:3px solid var(--paint)}
.pkg{border-bottom:3px solid #f4d34a;border-left-color:#f4d34a}
.bay{display:block;width:var(--cw);background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.door{display:block;background:#9aa0a8;padding:4px 4px 0}
.dr{display:block;height:24px;border-radius:3px 3px 0 0;background:repeating-linear-gradient(180deg,#d3d8df 0 3px,#aab0ba 3px 4px);font:700 12px/24px system-ui,sans-serif;color:#2a2f38}
.bay.on .dr{background:linear-gradient(#1d2026,#454c58);color:#ffd54a}
.stall{display:block;position:relative;height:var(--sh);border-right:3px solid var(--paint)}
.pkg .stall{border-right-color:#f4d34a;border-top:3px solid #f4d34a}
.bay:not(.on) .stall:after{content:"open";position:absolute;left:0;right:0;bottom:5px;font-size:10px;color:rgba(255,255,255,.28)}
.lbl{position:absolute;left:0;right:0;top:4px;font-size:10px;color:rgba(255,255,255,.45)}
.trl{position:absolute;inset:4px 5px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 0;color:var(--fg,#fff);overflow:hidden;
background:repeating-linear-gradient(180deg,rgba(0,0,0,.1) 0 2px,transparent 2px 9px),linear-gradient(90deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c) 45%,color-mix(in srgb,var(--c) 80%,#000));
box-shadow:0 4px 8px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.35);transition:transform .12s}
.trl .tr{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;line-height:1;font-weight:700;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5);flex:1;display:flex;align-items:center}
.trl .dw{font-size:9px;opacity:.9;font-style:normal}
.bay.lift .trl{transform:translateY(-6px) scale(1.1);z-index:3;overflow:visible;box-shadow:0 12px 16px rgba(0,0,0,.6),0 0 0 3px #fff}
.bay.hit .trl{box-shadow:0 0 0 4px #ffd54a,0 0 16px 6px rgba(255,213,74,.6)}
.gate{position:relative;margin-top:6px;padding:26px 10px 12px;border-top:5px solid #555b66;background:linear-gradient(#2d3036,#3a3e45)}
.gate:before{content:"";position:absolute;top:-14px;left:0;right:0;height:9px;background:repeating-linear-gradient(90deg,#8d939d 0 3px,transparent 3px 14px)}
.arm{position:absolute;top:4px;left:50%;right:10px;height:10px;border-radius:5px;background:repeating-linear-gradient(135deg,#e5392f 0 10px,#fff 10px 20px);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.booth{position:absolute;top:-2px;left:10px;width:46px;height:22px;border-radius:4px;background:#d8dde5;font-size:10px;font-weight:700;color:#3c424c;text-align:center;line-height:22px}
.lanes{display:flex;justify-content:space-around;color:#f5e6b8;font-weight:700;letter-spacing:.12em;font-size:13px;border-top:3px dashed rgba(245,230,184,.5);padding-top:8px}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25);transform:translateY(110%);transition:transform .2s;z-index:10;max-width:640px;margin:0 auto}
#sheet.open{transform:none}
#sheet h3{margin:0 0 8px;font-size:16px}
#sheet input{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:8px}
.chips{display:flex;gap:6px;margin-bottom:10px}
.chip{flex:1;padding:9px 2px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip.sel{background:var(--c);border-color:var(--c);color:var(--fg,#fff);font-weight:600}
.row{display:flex;gap:8px}
.btn{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<header>
<h1>Yard Map <small><span id="live" class="live off">Connecting…</span> · <span id="count"></span></small></h1>
<input id="q" type="search" placeholder="Find trailer number or note…" autocomplete="off">
<div id="msg"></div>
<div class="legend">
<span class="items" id="legend-items"></span>
<span class="zoom"><button id="zo">−</button><button id="zf">Fit</button><button id="zi">+</button></span>
</div>
</header>
<main>
<div class="lot">
<div class="pan" id="pan"><div class="scene" id="scene">
<div class="bld hall" style="left:460px;top:130px;width:960px;height:430px">WAREHOUSE</div><div class="bld" style="left:190px;top:560px;width:1230px;height:150px"></div><div class="bld" style="left:190px;top:560px;width:700px;height:300px"></div>
<div id="map"></div>
</div></div>
<div class="gate"><div class="booth">GATE</div><div class="arm"></div><div class="lanes"><span>⇠ OUT</span><span>IN ⇢</span></div></div>
</div>
</main>
<div id="sheet">
<h3 id="sh-title"></h3>
<input id="f-tr" placeholder="Trailer number" autocapitalize="characters" autocomplete="off">
<div class="chips" id="chips"></div>
<input id="f-note" placeholder="Note (optional)" autocomplete="off">
<div class="row">
<button class="btn" id="b-cancel">Cancel</button>
<button class="btn" id="b-clear">Clear spot</button>
<button class="btn pri" id="b-save">Save</button>
</div>
</div>
<script>
// Layout, statuses and trailers come from the server (/api/yard).
var SECTIONS=[],STATUS={},data={},cur=null,curStatus="",def="",sel=null,busy=false;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return"&#"+c.charCodeAt(0)+";"})}
// Dark text on light status colors (e.g. Undefined), white text otherwise.
function fg(hex){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return .299*r+.587*g+.114*b>170?"#1b2130":"#fff"}
function colors(name){var c=STATUS[name]||"#8b93a5";return"--c:"+c+";--fg:"+fg(c)}
function dwell(ts){var m=Math.floor((Date.now()-ts)/60000);if(m<60)return m+"m";var h=Math.floor(m/60);return h<48?h+"h":Math.floor(h/24)+"d"}
function apply(st){
  SECTIONS=st.sections;data=st.placements;STATUS={};
  st.statuses.forEach(function(s){STATUS[s.name]=s.color});
  if(sel&&!data[sel])sel=null;
  legend();render();
}
// Talk to the server. On success the reply is the new yard state.
function api(path,body){
  busy=true;
  return fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{})
    .then(function(r){return r.json().then(function(j){
      if(j.sections)apply(j);
      if(!r.ok)throw new Error(j.error||"Request failed");
      return j;
    })})
    .catch(function(e){$("msg").textContent=e.message==="Failed to fetch"?"Can't reach the server. Check the connection and try again.":e.message;throw e})
    .finally(function(){busy=false});
}
function legend(){
  var h="";Object.keys(STATUS).forEach(function(k){h+='<span><i style="background:'+STATUS[k]+'"></i>'+esc(k)+'</span>'});
  $("legend-items").innerHTML=h;
}
function render(){
  var html="",total=0,used=0;
  SECTIONS.forEach(function(s,si){
    html+='<div class="sec o'+s.o+'" style="--th:'+(s.th||40)+'px;left:'+s.x+'px;top:'+s.y+'px;--cols:'+s.cols+';--cw:'+s.cw+'px;--sh:'+s.sh+'px">'+(s.title?'<h2>'+esc(s.title)+'</h2>':'')+'<div class="grid'+(s.kind!=="door"?" pkg":"")+'">';
    s.spots.forEach(function(id){
      total++;var d=data[id];if(d)used++;
      html+='<button class="bay'+(d?" on":"")+'" data-id="'+esc(id)+'" data-s="'+si+'">';
      if(s.kind==="door")html+='<span class="door"><span class="dr">'+esc(id)+'</span></span>';
      html+='<span class="stall">';
      if(s.kind!=="door"&&!d)html+='<span class="lbl">'+esc(id)+'</span>';
      if(d)html+='<span class="trl" style="'+colors(d.status)+'"><b class="tr"></b><i class="dw">'+dwell(d.since)+'</i></span>';
      html+='</span></button>';
    });
    html+='</div></div>';
  });
  $("map").innerHTML=html;
  var btns=document.querySelectorAll(".bay");
  for(var i=0;i<btns.length;i++){
    var b=btns[i],d=data[b.dataset.id];
    if(d)b.querySelector(".tr").textContent=d.trailer;
    if(b.dataset.id===sel)b.classList.add("lift");
    b.onclick=function(){tap(this.dataset.id,+this.dataset.s)};
  }
  $("count").textContent=used+" of "+total+" spots in use";
  find(false);
  if(sel&&data[sel]&&!$("q").value)$("msg").textContent="Moving "+data[sel].trailer+": tap an open spot to place it, or tap it again to edit";
}
function tap(id,si){
  if(busy)return;
  var d=data[id];
  if(sel&&sel!==id){
    if(!d){var from=sel;sel=null;api("/api/move",{from:from,to:id}).catch(function(){});return}
    sel=id;render();return;
  }
  if(sel===id){sel=null;render();openSheet(id,si);return}
  if(d){sel=id;render();return}
  openSheet(id,si);
}
function chips(){
  var h="";Object.keys(STATUS).forEach(function(k){h+='<button class="chip'+(k===curStatus?" sel":"")+'" style="'+colors(k)+'" data-k="'+esc(k)+'">'+esc(k)+'</button>'});
  $("chips").innerHTML=h;
  var c=document.querySelectorAll(".chip");
  for(var i=0;i<c.length;i++)c[i].onclick=function(){curStatus=this.dataset.k;chips()};
}
function openSheet(id,si){
  cur=id;def=SECTIONS[si].defaultStatus;var d=data[id];
  $("sh-title").textContent=SECTIONS[si].noun+(/^[PU]\d+$/.test(id)?id.slice(1):id);
  $("f-tr").value=d?d.trailer:"";$("f-note").value=d&&d.note?d.note:"";
  curStatus=d?d.status:def;chips();$("b-clear").style.display=d?"":"none";
  $("sheet").classList.add("open");
  if(!d)setTimeout(function(){$("f-tr").focus()},220);
}
function closeSheet(){$("sheet").classList.remove("open");cur=null;document.activeElement&&document.activeElement.blur()}
$("b-cancel").onclick=closeSheet;
$("b-clear").onclick=function(){api("/api/clear",{spot:cur}).then(closeSheet,function(){})};
$("b-save").onclick=function(){
  var t=$("f-tr").value.trim().toUpperCase();
  if(!t){$("f-tr").focus();return}
  api("/api/place",{spot:cur,trailer:t,status:curStatus,note:$("f-note").value.trim()}).then(closeSheet,function(){});
};
function find(scroll){
  var q=$("q").value.trim().toUpperCase(),msg=$("msg");
  var btns=document.querySelectorAll(".bay"),first=null,n=0;
  for(var i=0;i<btns.length;i++){
    var d=data[btns[i].dataset.id],hit=!!(q&&d&&(d.trailer.indexOf(q)>-1||(d.note||"").toUpperCase().indexOf(q)>-1));
    btns[i].classList.toggle("hit",hit);
    if(hit){n++;if(!first)first=btns[i]}
  }
  if(!q)msg.textContent="";
  else if(!n)msg.textContent="No match for “"+q+"”";
  else{msg.textContent=n+" found";if(scroll)first.scrollIntoView({block:"center",inline:"center",behavior:"smooth"})}
}
var z=1;
function setZ(v){z=Math.max(.4,Math.min(2.2,v));$("scene").style.zoom=z}
var auto=true;
function fit(f){var w=$("pan").clientWidth;if(w>=700)setZ(Math.max(.4,Math.min(w/1560,(innerHeight-230)/1240,2.2)));else setZ(f?w/1560:1)}
$("zi").onclick=function(){auto=false;setZ(z+.15)};$("zo").onclick=function(){auto=false;setZ(z-.15)};
$("zf").onclick=function(){auto=true;fit(true)};
window.addEventListener("resize",function(){if(auto)fit()});
fit();
$("q").oninput=function(){find(true)};
$("msg").textContent="Loading…";
// Live updates: the server sends the whole yard every time anything changes.
// EventSource reconnects by itself if the connection drops.
var live=new EventSource("/api/events");
live.onmessage=function(e){apply(JSON.parse(e.data))};
live.onopen=function(){$("live").className="live";$("live").textContent="Live"};
live.onerror=function(){$("live").className="live off";$("live").textContent="Offline, reconnecting…"};
// Redraw once a minute so dwell times count up.
setInterval(function(){if(!sel)render()},60000);
</script>
</body>
</html>
